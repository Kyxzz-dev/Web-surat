services:

  # ==========================
  # Laravel (PHP-FPM)
  # ==========================
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: sinorat-app

    restart: unless-stopped

    working_dir: /var/www

    volumes:
      - ./:/var/www

    networks:
      - sinorat-network

    depends_on:
      mysql:
        condition: service_healthy

  # ==========================
  # NGINX
  # ==========================
  nginx:
    image: nginx:1.28-alpine

    container_name: sinorat-nginx

    restart: unless-stopped

    ports:
      - "8082:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - sinorat-network

  # ==========================
  # MySQL
  # ==========================
  mysql:
    image: mysql:8.1

    container_name: sinorat-mysql

    restart: unless-stopped

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sinorat
      MYSQL_USER: sinorat
      MYSQL_PASSWORD: secret

    command:
      --default-authentication-plugin=mysql_native_password

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - sinorat-network

  # ==========================
  # phpMyAdmin
  # ==========================
  phpmyadmin:
    image: phpmyadmin:latest

    container_name: sinorat-phpmyadmin

    restart: unless-stopped

    ports:
      - "8081:80"

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - sinorat-network

# ==========================
# Network
# ==========================

networks:
  sinorat-network:
    driver: bridge

# ==========================
# Volumes
# ==========================

volumes:
  mysql-data: